[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fibonacci-vortex-core"
version = "1.0.0"
description = "φ-modulated vortex core with Fibonacci hierarchy of layers"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Зиявутдинов Магомед Камалович", email = "zimakam@gmail.com"}
]
keywords = [
    "vortex",
    "fibonacci",
    "golden ratio",
    "fluid dynamics",
    "vortex core",
    "self-similarity",
    "lamb-oseen",
    "rankine",
    "scientific computing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.21",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.5"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "matplotlib>=3.5",
]

[project.urls]
Homepage = "https://github.com/Zimakam/fibonacci-vortex-core"
Repository = "https://github.com/Zimakam/fibonacci-vortex-core"
Issues = "https://github.com/Zimakam/fibonacci-vortex-core/issues"

[tool.setuptools]
py-modules = ["fibonacci_vortex_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "examples/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]